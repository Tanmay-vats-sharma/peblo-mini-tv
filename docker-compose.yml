services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/video_cms
      SECRET_KEY: change-this-development-secret
    ports:
      - "8001:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/catalogue:/app/catalogue
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  postgres_data: